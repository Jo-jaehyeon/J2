syntax = "proto3";
package j2;
option csharp_namespace = "J2.Protocol";

// IDs are stable wire values. Never reuse a retired ID or field number.
enum PacketId {
  NONE = 0;
  C_HELLO = 1;
  S_WELCOME = 2;
  C_PING = 3;
  S_PONG = 4;
  C_CHAT = 5;
  S_CHAT = 6;
}
message C_Hello { string client_name = 1; int32 protocol_version = 2; }
message S_Welcome { int32 session_id = 1; int32 protocol_version = 2; }
message C_Ping { int64 timestamp = 1; }
message S_Pong { int64 timestamp = 1; }
message C_Chat { string text = 1; }
message S_Chat { int32 player_id = 1; string text = 2; }
